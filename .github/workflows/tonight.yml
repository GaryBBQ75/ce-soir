name: Programme du soir

on:
  schedule:
    # Tous les jours vers 15h (Paris) : le programme de la soirée est stable
    - cron: '7 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les films du soir
        run: node scripts/fetch-tonight.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Enregistrer tonight.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/tonight.json
          git diff --cached --quiet || git commit -m "Programme du soir $(date +%F)"
          git push
