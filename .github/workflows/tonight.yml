name: Programme du soir et mise en ligne

on:
  schedule:
    # Tous les jours vers 15h (Paris) : le programme de la soirée est stable
    - cron: '7 14 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Récupérer les films du soir
        id: fetch
        continue-on-error: true # en cas d'échec, on garde le dernier tonight.json
        run: node scripts/fetch-tonight.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Enregistrer tonight.json
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/tonight.json
          git diff --cached --quiet || (git commit -m "Programme du soir $(date +%F)" && git push)

      - name: Construire l'app
        run: |
          npm ci
          npx vite build --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
