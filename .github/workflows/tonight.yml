name: Programme du soir et mise en ligne

on:
  schedule:
    # 6h pour la journée, puis 12h, 15h et 19h pour les changements de dernière minute (heure de Paris)
    - cron: '7 5 * * *'
    - cron: '7 11 * * *'
    - cron: '7 14 * * *'
    - cron: '7 18 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Construire l'app
        run: npx vite build --base=/${{ github.event.repository.name }}/

      # Programme + visuels écrits directement dans dist/
      - name: Récupérer le programme du soir
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-tonight.mjs
        env:
          OUT_DIR: dist
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # Les données du jour vivent sur une branche "data" (un seul commit, écrasé chaque jour)
      - name: Publier les données sur la branche data
        if: steps.fetch.outcome == 'success'
        run: |
          mkdir -p /tmp/data && cp -r dist/data dist/posters dist/logos /tmp/data/ 2>/dev/null || true
          cd /tmp/data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Programme du soir $(date +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      # Si la récupération échoue, on garde les données de la veille
      - name: Reprendre les dernières données
        if: steps.fetch.outcome != 'success'
        run: |
          git fetch --depth=1 origin data && git --work-tree=dist checkout origin/data -- . || echo "Pas de données précédentes"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
